name: Production health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      failure_drill:
        description: 'Intentionally fail this monitor to verify the alert path (no production mutation)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Check public site, database, auth configuration and inventory
        env:
          FAILURE_DRILL: ${{ inputs.failure_drill }}
        run: |
          if [ "$FAILURE_DRILL" = "true" ]; then
            node scripts/check-production.mjs --failure-drill
          else
            node scripts/check-production.mjs
          fi
